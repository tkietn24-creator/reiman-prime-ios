name: Build REIMAN PRIME iOS Dylib

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build Dylib via Apple Clang
        run: |
          cd REIMAN_PRIME_iOS
          chmod +x build_mac.sh
          ./build_mac.sh 2>&1 | tee build_output.log

      - name: Upload Dylib Artifact for Dai Ca
        uses: actions/upload-artifact@v4
        with:
          name: ReimanPrimeiOS-Dylib
          path: REIMAN_PRIME_iOS/ReimanPrimeiOS.dylib
          if-no-files-found: error
