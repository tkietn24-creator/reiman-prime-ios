name: Build REIMAN PRIME iOS Dylib

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Dylib via Apple Clang
        run: |
          cd REIMAN_PRIME_iOS
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload Dylib Artifact for Dai Ca
        uses: actions/upload-artifact@v4
        with:
          name: ReimanPrimeiOS-Dylib
          path: REIMAN_PRIME_iOS/ReimanPrimeiOS.dylib
          if-no-files-found: error
